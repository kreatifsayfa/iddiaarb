[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "iddiaarb"
version = "0.1.0"
description = "Arbitrage scanner MVP for fixed-odds betting snapshots"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
iddiaarb = "iddiaarb.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

