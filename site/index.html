<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>IddiaArb Live Console</title>
<style>
:root{--bg:#0b1020;--panel:#121a31;--soft:#1b2747;--text:#e8eeff;--muted:#9aabcf;--ok:#18c48f;--warn:#ffb020;--bad:#ff5d73;--line:#2a3964;--brand:#6f7dff}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 10% 0,#1a2a56,transparent 45%),var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif}
.app{max-width:1320px;margin:auto;padding:20px;display:grid;grid-template-columns:340px 1fr;gap:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px}
h1{margin:0 0 6px}.muted{color:var(--muted)}
label{display:block;font-size:.82rem;color:var(--muted);margin-bottom:4px}
input,select{width:100%;background:#0f1730;color:var(--text);border:1px solid var(--line);border-radius:9px;padding:8px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.row{margin-bottom:9px}.btn{border:0;border-radius:9px;padding:10px 12px;font-weight:700;cursor:pointer}.btn.primary{background:var(--brand);color:#fff}.btn.soft{background:var(--soft);color:#fff}
.btn.full{width:100%;margin-top:8px}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.kpi{background:var(--soft);border-radius:11px;padding:10px;border:1px solid var(--line)}.kpi .k{font-size:.72rem;color:var(--muted);text-transform:uppercase}.kpi .v{font-size:1.2rem;font-weight:800}
.badge{display:inline-block;padding:6px 10px;border-radius:999px;background:var(--soft);border:1px solid var(--line);font-size:.75rem;margin-right:6px}.ok{color:var(--ok)}
.msg{margin:10px 0;padding:10px;border-radius:10px;background:#0f1730;border:1px solid var(--line)}
.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:10px}table{width:100%;min-width:920px;border-collapse:collapse}th,td{padding:8px;border-bottom:1px solid #213056;font-size:.84rem}th{background:#162243;color:#a9bbe3;position:sticky;top:0}
pre{max-height:240px;overflow:auto;background:#0f1730;border:1px solid var(--line);border-radius:10px;padding:10px}
@media(max-width:1100px){.app{grid-template-columns:1fr}.kpis{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<div class="app">
  <aside class="card">
    <h1>Live Console</h1>
    <div class="muted">Hedef: sürekli güncel, çok kaynaklı ve güvenilir tarama.</div>
    <form id="frm">
      <div class="row"><label>Scraper source</label><select id="scraper_source_pick"><option value="multi" selected>multi (önerilen)</option><option value="flashscore">flashscore</option><option value="soccer24">soccer24</option><option value="livesport">livesport</option><option value="betexplorer">betexplorer</option><option value="sofascore">sofascore</option></select></div>
      <div class="grid2 row"><div><label>Bankroll</label><input id="bankroll" type="number" value="1000"></div><div><label>Min margin %</label><input id="min_margin" type="number" step="0.01" value="0"></div></div>
      <div class="grid2 row"><div><label>Min quality</label><input id="min_data_quality" type="number" step="0.01" value="0.15"></div><div><label>Min source quorum</label><input id="min_source_quorum" type="number" value="2"></div></div>
      <div class="grid2 row"><div><label>Max events</label><input id="max_events" type="number" value="40"></div><div><label>Max books/event</label><input id="max_bookmakers_per_event" type="number" value="10"></div></div>
      <div class="grid2 row"><div><label>Geo code</label><input id="geo_ip_code" value="GB"></div><div><label>Geo subdivision</label><input id="geo_ip_subdivision" value="GBENG"></div></div>
      <div class="grid2 row"><div><label>Slippage bps</label><input id="slippage_bps" type="number" value="0"></div><div><label>Rejection rate</label><input id="rejection_rate" type="number" step="0.01" value="0"></div></div>
      <div class="grid2 row"><div><label>Provider quorum</label><input id="quorum_min_sources" type="number" value="2"></div><div><label>Stream interval (sn)</label><input id="interval" type="number" value="15"></div></div>
      <div class="row"><label>Limits URL</label><input id="limits_file" placeholder="https://..."></div>
      <div class="row"><label>API base (opsiyonel)</label><input id="api_base" placeholder="https://worker.example"></div>
      <div class="row muted"><input id="use_cache" type="checkbox"> cache kullan (varsayılan canlı veri)</div>
      <button class="btn primary" type="submit">Tek tarama</button>
      <button id="streamBtn" class="btn soft full" type="button">Canlı stream başlat</button>
    </form>
  </aside>
  <main>
    <section class="card">
      <span id="clock" class="badge">--:--:--</span>
      <span id="cache" class="badge">cache:n/a</span>
      <span id="stream" class="badge">stream:kapalı</span>
    </section>
    <section class="kpis" style="margin-top:10px">
      <article class="kpi"><div class="k">Fırsat</div><div id="c1" class="v">0</div></article>
      <article class="kpi"><div class="k">En iyi margin</div><div id="c2" class="v">0%</div></article>
      <article class="kpi"><div class="k">Events</div><div id="c3" class="v">0</div></article>
      <article class="kpi"><div class="k">Güncellendi</div><div id="c4" class="v" style="font-size:1rem">-</div></article>
    </section>
    <section class="card" style="margin-top:10px">
      <div id="msg" class="msg">Tarama bekleniyor...</div>
      <div class="table-wrap"><table id="tbl"><thead><tr><th>#</th><th>Event</th><th>Market</th><th>Margin</th><th>Profit</th><th>Risk</th><th>Quality</th><th>Books</th></tr></thead><tbody id="rows"></tbody></table></div>
    </section>
    <section class="card" style="margin-top:10px"><h3>Diyagnostik</h3><pre id="diag">{}</pre></section>
  </main>
</div>
<script>
const $=id=>document.getElementById(id);
const E={frm:$("frm"),streamBtn:$("streamBtn"),rows:$("rows"),tbl:$("tbl"),msg:$("msg"),diag:$("diag"),c1:$("c1"),c2:$("c2"),c3:$("c3"),c4:$("c4"),clock:$("clock"),cache:$("cache"),stream:$("stream")};
let timer=null;
const num=(v,d)=>Number.isFinite(Number(v))?Number(v):d;
function url(path,p){const base=($("api_base").value||"").trim().replace(/\/+$/,'');const q='?'+p.toString();return base?base+path+q:path+q}
function params(refresh=true){const p=new URLSearchParams();
['bankroll','min_margin','min_data_quality','min_source_quorum','slippage_bps','rejection_rate','max_events','max_bookmakers_per_event','geo_ip_code','geo_ip_subdivision','quorum_min_sources'].forEach(k=>p.set(k,$(k).value));
p.set('scraper_source',$('scraper_source_pick').value);p.set('refresh',refresh?'1':'0');p.set('use_cache',$('use_cache').checked?'1':'0');
const lf=$("limits_file").value.trim();if(lf)p.set('limits_url',lf);return p;}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function legsFromOpp(o){const books=o.bookmakers||{};const odds=o.outcomes||{};return Object.keys(odds).map(k=>`<div><code>${esc(k)}</code>: ${esc(books[k]||'?')} @ ${num(odds[k],0).toFixed(2)}</div>`).join('')}
function setRows(data){const ops=data?.scan?.opportunities||[];E.rows.innerHTML=ops.map((o,i)=>`<tr><td>${i+1}</td><td>${esc(o.event||'-')}</td><td><code>${esc(o.market||'-')}</code></td><td>${num(o.margin_pct,0).toFixed(2)}%</td><td>${num(o.expected_profit,0).toFixed(2)}</td><td>${num(o.risk_score,0).toFixed(2)}</td><td>${num(o.data_quality_score,0).toFixed(2)}</td><td>${legsFromOpp(o)}</td></tr>`).join('');
E.c1.textContent=String(ops.length);E.c2.textContent=`${num(ops[0]?.margin_pct,0).toFixed(2)}%`;
const m=data?.scan?.meta||{};const scanned=Number(m.events_with_h2h||m.events_with_quorum||m.events_attempted||m.events_in||0);
E.c3.textContent=String(scanned);E.c4.textContent=new Date(data.generated_at||Date.now()).toLocaleTimeString();
E.diag.textContent=JSON.stringify(m,null,2);E.cache.textContent=data.cached?'cache:hit':'cache:bypass';
const warnings=Array.isArray(m.warnings)?m.warnings:[];const blocker=m.arbitrage_blocker||'';
if(ops.length>0){E.msg.innerHTML=`<span class="ok">${ops.length} fırsat bulundu.</span> kaynak: <b>${esc(data.params?.scraper_source||'-')}</b> / mod: <b>${esc(data.freshness?.mode||'-')}</b>`;}
else if(warnings.length>0){E.msg.innerHTML=`<b>Uyarılar:</b><br>${warnings.map(esc).join('<br>')}`;}
else if(blocker){E.msg.textContent=blocker;}
else{E.msg.innerHTML=`Veri alındı, fırsat yok. Tarana event: ${scanned}.`;}}
async function scan(refresh=true){E.msg.textContent='Tarama yapılıyor...';try{const r=await fetch(url('/api/scan',params(refresh)));const d=await r.json();if(!d.ok){E.msg.textContent='Hata: '+(d.error||'bilinmiyor');E.diag.textContent=JSON.stringify(d,null,2);return;}setRows(d);}catch(e){E.msg.textContent='Bağlantı hatası: '+e.message;}}
function toggle(){if(timer){clearInterval(timer);timer=null;E.stream.textContent='stream:kapalı';E.streamBtn.textContent='Canlı stream başlat';return}const sec=Math.max(3,Math.min(120,parseInt($("interval").value||'15',10)));timer=setInterval(()=>scan(true),sec*1000);E.stream.textContent='stream:açık';E.streamBtn.textContent='Canlı stream durdur';scan(true)}
E.frm.addEventListener('submit',e=>{e.preventDefault();scan(true)});E.streamBtn.addEventListener('click',toggle);setInterval(()=>E.clock.textContent=new Date().toLocaleTimeString(),1000);scan(true);
</script>
</body>
</html>
